<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Rabino Home Builders Corporation logo</title>
  <desc id="desc">Rabino Home Builders Corporation wordmark with stylized houses and green leaf.</desc>
  <rect width="900" height="900" fill="#ffffff"/>

  <g transform="translate(160,130) scale(0.82)">
    <!-- Left green house -->
    <path d="M25 250 L150 150 L290 175 L215 305 L105 305 Z" fill="#8bd400"/>
    <rect x="82" y="215" width="18" height="24" fill="#e43a22"/>
    <rect x="106" y="215" width="18" height="24" fill="#e43a22"/>
    <rect x="95" y="190" width="6" height="50" fill="#ffffff"/>
    <rect x="79" y="208" width="54" height="6" fill="#ffffff"/>

    <!-- Top blue roof -->
    <path d="M160 135 L255 55 L360 55 L435 125 L318 145 L255 180 Z" fill="#19106f"/>
    <rect x="264" y="62" width="10" height="80" fill="#ffffff"/>
    <rect x="225" y="101" width="120" height="10" fill="#ffffff"/>

    <!-- Red central roof/house -->
    <path d="M170 390 L390 155 L585 85 L760 240 L670 145 L215 390 Z" fill="#e5391b"/>
    <rect x="660" y="150" width="34" height="88" fill="#e5391b"/>

    <!-- Blue window emblem -->
    <g transform="translate(500,220)">
      <path d="M120 0 a94 94 0 0 1 94 94 h-94z" fill="#19106f"/>
      <path d="M120 0 a94 94 0 0 0 -94 94 h94z" fill="#19106f"/>
      <rect x="18" y="102" width="84" height="84" fill="#19106f"/>
      <rect x="108" y="102" width="84" height="84" fill="#19106f"/>
      <rect x="112" y="0" width="8" height="186" fill="#ffffff"/>
      <rect x="10" y="94" width="188" height="8" fill="#ffffff"/>
    </g>

    <!-- Right leaf -->
    <path d="M760 155 C835 195 878 265 881 365 C883 470 843 555 760 615 C815 600 854 563 874 512 C906 430 900 312 853 236 C830 198 799 171 760 155 Z" fill="#8bf000"/>
    <path d="M804 280 C831 325 845 382 846 446 C833 388 813 338 786 295 Z" fill="#ffffff"/>
    <path d="M771 338 C807 365 829 401 843 442 C812 407 788 378 756 349 Z" fill="#ffffff" opacity="0.92"/>

    <!-- Wordmark -->
    <text x="145" y="560" font-family="Arial, Helvetica, sans-serif" font-size="132" letter-spacing="26" fill="#19106f">RABINO</text>
    <text x="147" y="612" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="14" fill="#19106f">HOME BUILDERS CORPORATION</text>
    <text x="136" y="676" font-family="Brush Script MT, Segoe Script, cursive" font-size="58" fill="#8bd400">"Turning Dreams into Possibilities."</text>
    <rect x="30" y="658" width="55" height="8" fill="#8bd400"/>
  </g>
</svg>
